services:
  # -------------------------------------------------------------
  # 1. Go Production API Service
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_prod_api
    restart: unless-stopped
    ports:
      # Configurable host port (default: 8080)
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    networks:
      - monitoring_net

  # -------------------------------------------------------------
  # 2. Prometheus Metrics Collector
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: go_prod_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - monitoring_net

  # -------------------------------------------------------------
  # 3. Grafana Dashboard & Visualization
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: go_prod_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_net

  # -------------------------------------------------------------
  # 4. Optional Local PostgreSQL Service (Profile: local-db)
  # -------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: go_prod_postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: listings_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge

volumes:
  pgdata:
  grafana_data:
